<div class="game-launcher{% if include.canvas %} game-launcher--canvas{% endif %}" data-game-launcher>
  <div class="game-preview">
    <img src="{{ include.poster | default: page.image_url | relative_url }}" alt="" loading="lazy">
    <div class="game-play-overlay">
      <button class="game-play-button" type="button" aria-expanded="false" aria-controls="{{ include.id }}-player">Play Game</button>
    </div>
  </div>
  <div class="game-player" id="{{ include.id }}-player" hidden>
    <iframe data-src="{{ include.url }}" title="{{ include.title }} browser game" allow="autoplay; fullscreen"></iframe>
  </div>
  <noscript><p><a href="{{ include.url }}">Play Game</a></p></noscript>
</div>
<script src="{{ '/assets/js/game-player.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
